# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Hyprlock config cleaned for fingerprint + password
# Optimized to avoid text overlap in center area

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock

    fingerprint:enabled = true
    fingerprint:ready_message = Empreinte digitale
    fingerprint:present_message = Lecture de l'empreinte...
    fingerprint:retry_delay = 250
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgb(0,0,0)

    blur_size = 3
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# =========================
# DATE
# =========================
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
    color = $color13
    font_size = 48
    font_family = Victor Mono Bold Italic
    position = 0, -60
    halign = center
    valign = center
    zindex = 1
}

# =========================
# TIME
# =========================
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = $color8
    font_size = 130
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -250
    halign = center
    valign = top
    zindex = 1
}

# =========================
# USER
# =========================
label {
    monitor =
    text =   $USER
    color = $color9
    font_size = 36
    font_family = Victor Mono Bold Oblique
    position = 0, 360
    halign = center
    valign = bottom
    zindex = 2
}

# =========================
# FINGERPRINT ICON
# =========================
label {
    monitor =
    text = 󰈷
    color = $color13
    font_size = 72
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 210
    halign = center
    valign = bottom
    zindex = 10
}

# =========================
# AUTH TITLE
# =========================
label {
    monitor =
    text = Empreinte digitale
    color = $color13
    font_size = 22
    font_family = Victor Mono Bold Oblique
    position = 0, 165
    halign = center
    valign = bottom
    zindex = 10
}

# =========================
# AUTH HELP TEXT
# =========================
label {
    monitor =
    text = Pose ton doigt ou tape ton mot de passe
    color = $color8
    font_size = 16
    font_family = Victor Mono Bold Oblique
    position = 0, 138
    halign = center
    valign = bottom
    zindex = 10
}

# =========================
# DYNAMIC FINGERPRINT STATUS
# =========================
label {
    monitor =
    text = $FPRINTPROMPT
    color = $color8
    font_size = 14
    font_family = Victor Mono Bold Oblique
    position = 0, 112
    halign = center
    valign = bottom
    zindex = 10
}

# =========================
# PASSWORD FIELD
# =========================
input-field {
    monitor =
    size = 260, 62
    outline_thickness = 2
    dots_size = 0.20
    dots_spacing = 0.20
    dots_center = true
    outer_color = $color8
    inner_color = rgba(255, 255, 255, 0.10)
    capslock_color = rgb(255,255,255)
    font_color = $color13
    fade_on_empty = false
    font_family = Victor Mono Bold Oblique
    placeholder_text = <i><span foreground="##ffffff99">Mot de passe</span></i>
    check_text = <i>Vérification...</i>
    fail_text = <i>Échec de l'authentification</i>
    hide_input = false
    rounding = 20
    position = 0, 35
    halign = center
    valign = bottom
    zindex = 5
}

# =========================
# KEYBOARD LAYOUT
# =========================
label {
    monitor =
    text = $LAYOUT
    color = $color8
    font_size = 14
    font_family = Victor Mono Bold Oblique
    position = 0, 8
    halign = center
    valign = bottom
    zindex = 2
}

# =========================
# UPTIME
# =========================
label {
    monitor =
    text = cmd[update:60000] echo "<b> "$(uptime -p || $Scripts/UptimeNixOS.sh)" </b>"
    color = $color8
    font_size = 24
    font_family = Victor Mono Bold Oblique
    position = 0, 0
    halign = right
    valign = bottom
    zindex = 1
}

# =========================
# BATTERY
# =========================
label {
    monitor =
    text = cmd[update:1000] echo "<b> "$($Scripts/Battery.sh)" </b>"
    color = $color8
    font_size = 16
    font_family = Victor Mono Bold Oblique
    position = 0, 30
    halign = right
    valign = bottom
    zindex = 1
}

# =========================
# WEATHER
# =========================
label {
    monitor =
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache"
    color = $color8
    font_size = 14
    font_family = Victor Mono Bold Oblique
    position = 50, 0
    halign = left
    valign = bottom
    zindex = 1
}
